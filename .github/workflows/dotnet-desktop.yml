name: .NET Build & Test

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:   # lets you trigger the run manually from the Actions tab

env:
  DOTNET_VERSION: 8.0.x
  PROJECT_PATH: MazeTorchSharp.csproj

jobs:

  # ----------------------------------------------------------------------
  # Stage 1: Build (matrix across OS + configuration)
  # ----------------------------------------------------------------------
  build:
    name: Build (${{ matrix.os }} / ${{ matrix.configuration }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        configuration: [Debug, Release]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration ${{ matrix.configuration }} --no-restore

      # Publish a self-contained artifact only from the Linux Release build
      - name: Publish
        if: matrix.os == 'ubuntu-latest' && matrix.configuration == 'Release'
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --no-build --output ./publish

      - name: Upload build artifact
        if: matrix.os == 'ubuntu-latest' && matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: maze-app
          path: ./publish
          retention-days: 7

  # ----------------------------------------------------------------------
  # Stage 2: Test
  # Runs after build succeeds. If you have no test project this is skipped
  # gracefully instead of failing the whole pipeline.
  # ----------------------------------------------------------------------
  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Detect test projects
        id: detect
        run: |
          if ls **/*[Tt]est*.csproj >/dev/null 2>&1; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No test project found — skipping test stage."
          fi

      - name: Run tests
        if: steps.detect.outputs.has_tests == 'true'
        run: dotnet test --configuration Release --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: steps.detect.outputs.has_tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/results.trx'
          retention-days: 7

  # ----------------------------------------------------------------------
  # Stage 3: Smoke run
  # Actually runs the maze trainer to confirm it executes end-to-end.
  # ----------------------------------------------------------------------
  smoke-run:
    name: Smoke run (execute the maze)
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Run the application
        run: dotnet run --project ${{ env.PROJECT_PATH }} --configuration Release
